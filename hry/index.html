const S={n:0,names:['Hráč 1','Hráč 2','Hráč 3','Hráč 4'],players:[],mode:'single',sel:new Set(['jasterica']),randCount:3,

/* ---------- audio ---------- */
let AC=null;
function ensureAudio(){try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume();}catch(e){}}
function tone(f1,f2,dur,type='sine',vol=.12,delay=0){
  if(!AC)return;
  try{const t0=AC.currentTime+delay,o=AC.createOscillator(),g=AC.createGain();
    o.type=type;o.frequency.setValueAtTime(f1,t0);o.frequency.exponentialRampToValueAtTime(f2,t0+dur);
    g.gain.setValueAtTime(vol,t0);g.gain.exponentialRampToValueAtTime(.001,t0+dur);
    o.connect(g).connect(AC.destination);o.start(t0);o.stop(t0+dur+.02);}catch(e){}
}
const recKey=id=>id==='jasterica'?'jasterica-rekord':'rekord-'+id;

}

const TP='ezvhry1/';
function Relay(subTopic,onRaw){
  let first=null,firstDone=false;
  const cls=BROKERS.map(u=>{
    const c=mqtt.connect(u,{clientId:'hpp_'+Math.random().toString(36).slice(2,12),clean:true,keepalive:15,reconnectPeriod:1500,connectTimeout:8000});
    c.on('connect',()=>{c.subscribe(subTopic,{qos:1});if(!firstDone){firstDone=true;first&&first();}});
    c.on('message',(t,b)=>{try{onRaw(JSON.parse(b.toString()));}catch(e){}});
    c.on('error',()=>{});
    return c;
  });
  return {
    pub(t,o){const s=JSON.stringify(o);cls.forEach(c=>{try{c.publish(t,s,{qos:1});}catch(e){}});},
    end(){cls.forEach(c=>{try{c.end(true);}catch(e){}});},
    connected:()=>cls.some(c=>c.connected),
    onConnect(fn){first=fn;if(firstDone)fn();}
  };
}
function Inbox(deliver){
  const st={};
  return raw=>{
    if(!raw||raw.f==null||typeof raw.s!=='number')return;
    const q=st[raw.f]=st[raw.f]||{n:0,buf:new Map(),timer:null};
    if(raw.s<q.n||q.buf.has(raw.s))return;
    q.buf.set(raw.s,raw.m);
    const flush=()=>{
      while(q.buf.has(q.n)){const m=q.buf.get(q.n);q.buf.delete(q.n);q.n++;deliver(raw.f,m);}
      clearTimeout(q.timer);
      if(q.buf.size)q.timer=setTimeout(()=>{q.n=Math.min(...q.buf.keys());flush();},1500);
    };
    flush();
  };
}
function sendTo(c,m){try{c&&c.open&&c.send(m);}catch(e){}}
function send(m){if(isHost())NET.conns.forEach(c=>sendTo(c,m));else sendTo(NET.conn,m);}
function netStatus(t,err){const el=$('#nstatus');if(el){el.textContent=t;el.className='nstatus'+(err?' err':'');}}

function resetNet(){
  clearTimeout(NET.joinTimer);clearInterval(NET.hb);clearInterval(NET.helloT);
  try{NET.relay&&NET.relay.end();}catch(e){}
  Object.assign(NET,{relay:null,conn:null,conns:[],vconns:{},role:null,me:0,started:false,lobby:[],ready:{},finals:{},round:0,live:[],leaving:false,players_ok:false,code:null,hb:null,helloT:null,hostSeen:0});
}
document.addEventListener('visibilitychange',()=>{if(document.hidden)return;const now=Date.now();NET.hostSeen=now;(NET.conns||[]).forEach(c=>c.seen=now);});
function leave(){NET.leaving=true;send({t:'bye'});setTimeout(resetNet,600);if(CUR){CUR.abort();CUR=null;}S.players=[];home();}
function endAll(text){
  if(NET.leaving)return;
  NET.leaving=true;if(CUR){CUR.abort();CUR=null;}
  setTimeout(resetNet,600);
  modal(text,[{t:'OK',cls:'primary',fn:()=>{S.players=[];home();}}]);
}
function askLeave(){modal('Odpojiť sa a ukončiť hru na viacerých telefónoch?',[{t:'Zostať',cls:'primary',fn:()=>{}},{t:'Odpojiť',cls:'danger',fn:leave}]);}

function hostGame(){
  resetNet();NET.role='host';NET.me=0;
  const code=String(1000+Math.floor(Math.random()*9000));NET.code=code;
  NET.lobby=[{name:NET.myName,conn:null}];
  lobbyScreen();netStatus('Pripájam sa na server…');
  const mk=id=>{const c={id,open:true,seen:Date.now(),s:0,send(m){NET.relay.pub(TP+code+'/g/'+id,{f:'H',s:c.s++,m});}};return c;};
  NET.relay=Relay(TP+code+'/h',Inbox((from,m)=>{
    if(NET.role!=='host')return;
    let c=NET.vconns[from];
    if(!c){
      if(m.t!=='hello')return;
      c=NET.vconns[from]=mk(from);
      if(NET.started){sendTo(c,{t:'reject',text:'Táto hra už začala.'});c.open=false;return;}
      if(NET.lobby.length>=MAXP){sendTo(c,{t:'reject',text:'Hra je plná (max. 4 telefóny).'});c.open=false;return;}
    }
    if(!c.open)return;
    c.seen=Date.now();
    if(m.t!=='hb')hostMsg(c,m);
  }));
  NET.relay.onConnect(()=>{if(NET.role==='host'&&!NET.started&&NET.lobby.length<2)lobbyScreen();});
  NET.joinTimer=setTimeout(()=>{if(NET.role==='host'&&NET.relay&&!NET.relay.connected())netStatus('Nepodarilo sa pripojiť na server. Skontroluj internet a skús znova.',true);},10000);
  NET.hb=setInterval(()=>{
    const now=Date.now();
    NET.conns.slice().forEach(c=>{sendTo(c,{t:'hb'});if(now-c.seen>25000){c.open=false;guestGone(c);}});
  },3000);
}

function broadcastLobby(){
  const players=lobbyPlayers();
  NET.lobby.forEach((l,i)=>{if(l.conn)sendTo(l.conn,{t:'lobby',players,me:i});});
  if(!NET.started)lobbyScreen();
}

function guestGone(c){
  if(NET.leaving||!isHost())return;
  const i=NET.lobby.findIndex(l=>l.conn===c);
  NET.conns=NET.conns.filter(x=>x!==c);
  if(i<0)return;
  const name=NET.lobby[i].name;
  if(!NET.started){NET.lobby.splice(i,1);broadcastLobby();return;}
  send({t:'abort',text:`📵 ${name} sa odpojil(a). Hra sa skončila.`});
  endAll(`📵 ${esc(name)} sa odpojil(a). Hra sa skončila.`);
}

function idxOf(c){return NET.lobby.findIndex(l=>l.conn===c);}

function hostMsg(c,m){
  if(!m||!m.t)return;
  const i=idxOf(c);
  switch(m.t){
    case 'hello':
      if(i>=0){broadcastLobby();return;}
      if(NET.started||NET.lobby.length>=MAXP)return;
      NET.lobby.push({name:(m.name||'Hráč').slice(0,12),conn:c});NET.conns.push(c);
      tone(660,990,.15,'triangle',.1);broadcastLobby();break;
    case 'bye': guestGone(c);break;
    case 'ready': if(i>=0){(NET.ready[m.r]=NET.ready[m.r]||new Set()).add(i);maybeGo();}break;
    case 'sc': if(i>=0){NET.live[i]=m.v;send({t:'live',a:NET.live});}break;
    case 'final': if(i>=0)storeFinal(m.round,i,m.score,m.stats);break;
  }
}

function joinGame(code){
  resetNet();NET.role='guest';NET.code=code;
  const myId='g'+Math.random().toString(36).slice(2,10);
  netStatus('Pripájam sa k hre '+code+'…');
  NET.hostSeen=Date.now();
  NET.relay=Relay(TP+code+'/g/'+myId,Inbox((from,m)=>{
    if(from!=='H'||NET.role!=='guest')return;
    NET.hostSeen=Date.now();
    if(m.t!=='hb')guestMsg(m);
  }));
  const c={open:true,s:0,send(m){NET.relay.pub(TP+code+'/h',{f:myId,s:c.s++,m});}};
  NET.conn=c;
  const hello=()=>{if(!NET.players_ok&&NET.role==='guest')sendTo(c,{t:'hello',name:NET.myName});};
  NET.relay.onConnect(hello);
  NET.helloT=setInterval(hello,2000);
  NET.joinTimer=setTimeout(()=>{
    if(NET.players_ok)return;
    const ok=NET.relay&&NET.relay.connected();
    resetNet();
    netStatus(ok?'Hra s kódom '+code+' sa nenašla. Skontroluj kód a či má hostiteľ otvorenú čakáreň.':'Nepodarilo sa pripojiť na server. Skontroluj internet.',true);
  },15000);
  NET.hb=setInterval(()=>{
    if(!NET.players_ok)return;
    sendTo(c,{t:'hb'});
    if(Date.now()-NET.hostSeen>25000)endAll('📵 Spojenie s hostiteľom sa prerušilo.');
  },3000);
}

function guestMsg(m){
  if(!m||!m.t)return;
  switch(m.t){
    case 'reject': clearTimeout(NET.joinTimer);NET.leaving=true;netStatus(m.text,true);setTimeout(resetNet,300);break;
    case 'lobby':
      clearTimeout(NET.joinTimer);
      if(!NET.players_ok)tone(660,990,.15,'triangle',.1);
      NET.players_ok=true;S.players=m.players;NET.me=m.me;lobbyScreen();break;
    case 'start':
      NET.started=true;S.players=m.players;
      waitScreen('Ideme hrať! 🎉','Hostiteľ vyberá hru…');break;
    case 'abort': endAll(esc(m.text||'Hra sa skončila.'));break;
    case 'bye': endAll('📵 Hostiteľ ukončil hru.');break;
    case 'setup':
      S.queue=m.queue;S.isTour=m.isTour;S.gi=0;
      S.tpoints=S.players.map(()=>0);S.totals=S.players.map(()=>0);
      startGame();break;
    case 'go': launchOnline(m.seed);break;
    case 'live': NET.live=m.a;break;
    case 'results': applyResults(m);break;
    case 'nav':
      if(m.a==='next'){S.gi++;startGame();}
      else if(m.a==='again')startGame();
      else if(m.a==='pick')waitScreen('Ďalšie kolo','Hostiteľ vyberá hru…');
      else if(m.a==='final')finalScreen();
      break;
  }
}

/* ---- priebeh online hry ---- */
function startOnline(queue,isTour){
  S.queue=queue;S.isTour=isTour;S.gi=0;S.tpoints=S.players.map(()=>0);S.totals=S.players.map(()=>0);
  send({t:'setup',queue,isTour});startGame();
}
function onlineReady(){
  const k=NET.round+1;
  if(isHost()){(NET.ready[k]=NET.ready[k]||new Set()).add(0);maybeGo();}
  else send({t:'ready',r:k});
}
function maybeGo(){
  if(!isHost())return;
  const k=NET.round+1,set=NET.ready[k];
  if(set&&!set.went&&set.size>=S.players.length){
    set.went=true;const seed=Math.floor(Math.random()*4294967295);
    send({t:'go',seed});launchOnline(seed);
  }
}
function launchOnline(seed){
  NET.round++;NET.live=S.players.map(()=>0);S.scores=[];S.stats=[];
  const g=GAME(S.queue[S.gi]),p=S.players[NET.me],round=NET.round;
  CUR=RUNNERS[g.id](p,res=>{
    CUR=null;
    if(isHost())storeFinal(round,0,res.score,res.stats);
    else{send({t:'final',round,score:res.score,stats:res.stats});waitScreen('Koniec kola','Čakám, kým dohrajú ostatní…');}
  },{seed,online:true,
    opp:()=>S.players.map((pp,i)=>({p:pp,score:NET.live[i]||0})).filter((_,i)=>i!==NET.me),
    onScore:v=>{if(isHost()){NET.live[0]=v;send({t:'live',a:NET.live});}else send({t:'sc',v});}});
}
function storeFinal(round,i,score,stats){
  const f=NET.finals[round]=NET.finals[round]||{scores:[],stats:[],n:0};
  if(f.scores[i]===undefined)f.n++;
  f.scores[i]=score;f.stats[i]=stats;
  if(i===0&&f.n<S.players.length)waitScreen('Koniec kola','Čakám, kým dohrajú ostatní…');
  if(f.n>=S.players.length&&!f.sent){
    f.sent=true;const m={t:'results',round,scores:f.scores,stats:f.stats};
    send(m);applyResults(m);
  }
}
function applyResults(m){
  if(m.round!==NET.round)return;
  if(CUR){CUR.abort();CUR=null;}
  S.scores=m.scores.slice();S.stats=m.stats.slice();
  gameResults();
}

/* spoločný riadok so skóre súperov počas hry */
function drawOppHud(my,opps){
  ctx.textBaseline='middle';ctx.lineJoin='round';
  let x=10;const compact=opps.length>1;
  for(const o of opps){
    const lab=compact?`${o.p.avatar} ${o.score}`:`${o.p.avatar} ${o.p.name}: ${o.score}`;
    ctx.font=FONT(17);const w=ctx.measureText(lab).width+22;
    ctx.globalAlpha=.92;ctx.fillStyle=o.p.color;rr(x,80,w,32,11);ctx.fill();ctx.globalAlpha=1;
    ctx.fillStyle='#fff';ctx.textAlign='left';ctx.fillText(lab,x+11,97);x+=w+6;
  }
  let t,c;
  if(opps.length===1){const lead=my-opps[0].score;t=lead>0?'vedieš o '+lead:lead<0?'súper vedie o '+(-lead):'remíza';c=lead>0?'#15803d':lead<0?'#b91c1c':'#4b5563';}
  else{const rank=opps.filter(o=>o.score>my).length+1;
    t=rank===1?(opps.some(o=>o.score===my)?'delené 1. miesto':'vedieš! 🥇'):`si ${rank}. z ${opps.length+1}`;c=rank===1?'#15803d':'#b91c1c';}
  ctx.font=FONT(15);ctx.lineWidth=4;ctx.strokeStyle='#fff';ctx.textAlign='left';ctx.strokeText(t,x+4,97);ctx.fillStyle=c;ctx.fillText(t,x+4,97);
}

function planScreen(list,random){
  const n=S.players.length;
  show(`<div class="screen">
   <div class="top"><button class="back" id="back">←</button><h2>🏆 Turnaj</h2></div>

     <p class="note" style="text-align:left">${n>1?`Za každú hru: 1. miesto ${n} b, 2. miesto ${n-1} b… Kto má na konci najviac, vyhráva.`:'Body zo všetkých hier sa sčítajú.'}</p>
   </div>
   <button class="primary" id="go">Začať turnaj ▶</button>
  </div>`);
  $('#back').onclick=gamesScreen;
  $('#go').onclick=()=>{
    if(online()){startOnline(list,true);return;}
    S.isTour=true;S.queue=list;S.gi=0;S.tpoints=S.players.map(()=>0);S.totals=S.players.map(()=>0);
    startGame();
  };
}

function startGame(){S.pi=0;S.scores=[];S.stats=[];S.runId++;readyScreen();}

function readyScreen(){
  const g=GAME(S.queue[S.gi]);
  if(g.id==='auta')return autaReady(g);
  if(online()){
    const me=S.players[NET.me];
    show(`<div class="screen">
     ${S.isTour?`<div class="badge">Hra ${S.gi+1} z ${S.queue.length}</div>`:''}
     <div class="panel center"><div class="big">${g.icon}</div><h2>${g.name}</h2>${g.rules}
       <p class="note">Všetci hráte naraz – na každom telefóne je rovnaké rozloženie hry.</p></div>
     <div class="turn" style="--c:${me.color}"><small>Hráš za</small><div>${me.avatar} ${esc(me.name)}</div></div>
     <button class="primary" id="go">Som pripravený ▶</button>
     <button class="link" id="lv">Odpojiť sa</button></div>`);
    $('#go').onclick=()=>{ensureAudio();waitScreen('Pripravený ✅','Čakám na ostatných hráčov…');onlineReady();};
    $('#lv').onclick=askLeave;
    return;
  }
  const p=S.players[S.pi];
  show(`<div class="screen">
   ${S.isTour?`<div class="badge">Hra ${S.gi+1} z ${S.queue.length}</div>`:''}
   <div class="panel center"><div class="big">${g.icon}</div><h2>${g.name}</h2>${g.rules}</div>
   <div class="turn" style="--c:${p.color}"><small>Na rade je</small><div>${p.avatar} ${esc(p.name)}</div></div>
   <button class="primary" id="go">Som pripravený ▶</button>
   <button class="link" id="menu">← Späť na výber hier</button>
  </div>`);
  $('#go').onclick=()=>{ensureAudio();CUR=RUNNERS[g.id](p,res=>{
    CUR=null;S.scores[S.pi]=res.score;S.stats[S.pi]=res.stats;
    if(S.players.length===1)gameResults();else turnResult();
  },{seed:Math.floor(Math.random()*4294967295)});};
  $('#menu').onclick=gamesScreen;
}

function turnResult(){
  const p=S.players[S.pi],sc=S.scores[S.pi],st=S.stats[S.pi],gid=S.queue[S.gi];
  const more=S.pi<S.players.length-1,np=S.players[S.pi+1];
  show(`<div class="screen">
   <div class="panel center"><div class="big">${p.avatar}</div><h2>${esc(p.name)}</h2>
     <div class="score">${sc} <small>${bodW(sc)}</small></div>
     <div class="stats">${statLine(gid,st)}</div></div>
   ${more?`<div class="turn" style="--c:${np.color}"><small>Ďalej hrá</small><div>${np.avatar} ${esc(np.name)}</div></div>
     <button class="primary" id="go">Pokračovať ▶</button>`
   :`<button class="primary" id="go">Výsledky hry ➜</button>`}
  </div>`);
  $('#go').onclick=()=>{if(more){S.pi++;readyScreen();}else gameResults();};
}

const rankOf=a=>a.map(v=>a.filter(w=>w>v).length);
const MEDAL=['🥇','🥈','🥉','4.'];

function gameResults(){
  const g=GAME(S.queue[S.gi]),n=S.players.length,ranks=rankOf(S.scores);
  if(S.counted!==S.runId){
    S.counted=S.runId;S.newRec=false;
    if(S.isTour)S.players.forEach((p,i)=>{S.tpoints[i]+=n-ranks[i];S.totals[i]+=S.scores[i];});
    if(n===1&&S.scores[0]>getRec(g.id)){setRec(g.id,S.scores[0]);S.newRec=true;}
  }
  const last=!S.isTour||S.gi>=S.queue.length-1;
  let body;
  if(n===1){
    const st=S.stats[0];
    body=`<div class="panel center"><div class="big">${g.icon}</div><h2>${g.name}</h2>
      <div class="score">${S.scores[0]} <small>${bodW(S.scores[0])}</small></div>
      <div class="stats">${statLine(g.id,st)}</div>
      ${S.newRec?'<div class="newrec">🎉 Nový rekord!</div>':`<div class="rec">Rekord: ${getRec(g.id)}</div>`}
      ${S.isTour?`<div class="rec">Spolu v turnaji: ${S.totals[0]}</div>`:''}</div>`;
  }else{
    const order=S.players.map((_,i)=>i).sort((a,b)=>ranks[a]-ranks[b]);
    body=`<div class="panel center"><div class="big">${g.icon}</div><h2>Výsledky – ${g.name}</h2>
      <div class="table">${order.map((i,k)=>`<div class="row" style="--c:${S.players[i].color};animation-delay:${k*.12}s">
        <span class="m">${MEDAL[ranks[i]]}</span><span class="nm">${S.players[i].avatar} ${esc(S.players[i].name)}</span>
        <span class="pts">${S.scores[i]}</span>${S.isTour?`<span class="sm">+${n-ranks[i]} b</span>`:''}</div>`).join('')}</div>
      ${online()?`<div class="stats" style="font-size:16px">${S.players.map((p,i)=>`${p.avatar} ${statLine(g.id,S.stats[i])}`).join('<br>')}</div>`:''}</div>`;
  }
  let btns;
  const guest=online()&&!isHost();
  if(guest){
    btns=`<div class="panel center"><p class="lead" style="font-weight:600">Hostiteľ ${esc(S.players[0].name)} rozhodne, čo ďalej…</p><div class="spin"></div></div><button class="link" id="lv">Odpojiť sa</button>`;
  }else if(S.isTour){
    btns=last?`<button class="primary" id="b1">🏆 Celkové poradie</button>`
      :`<button class="primary" id="b1">Ďalšia hra (${S.gi+2}/${S.queue.length}): ${GAME(S.queue[S.gi+1]).icon} ${GAME(S.queue[S.gi+1]).name} ➜</button>`;
  }else{
    btns=`<button class="primary" id="b1">🔁 Hrať znova</button><button class="secondary" id="b2">Iná hra</button><button class="link" id="b3">${online()?'Odpojiť sa':'Hlavné menu'}</button>`;
  }
  show(`<div class="screen">${S.isTour?`<div class="badge">Hra ${S.gi+1} z ${S.queue.length}</div>`:''}${body}<div class="btns">${btns}</div></div>`);
  if(n>1||S.newRec)confetti(S.newRec?40:18);
  if(guest){$('#lv').onclick=askLeave;return;}
  const nav=a=>{if(online())send({t:'nav',a});};
  if(S.isTour){$('#b1').onclick=()=>{if(last){nav('final');finalScreen();}else{nav('next');S.gi++;startGame();}};}
  else{
    $('#b1').onclick=()=>{nav('again');startGame();};
    $('#b2').onclick=()=>{nav('pick');gamesScreen();};
    $('#b3').onclick=online()?askLeave:home;
  }
}

function finalScreen(){
  const n=S.players.length;
  const order=S.players.map((_,i)=>i).sort((a,b)=>S.tpoints[b]-S.tpoints[a]||S.totals[b]-S.totals[a]);
  const key=i=>S.tpoints[i]*10000+S.totals[i];
  const place=i=>order.filter(j=>key(j)>key(i)).length;
  let body;
  if(n===1){
    body=`<div class="panel center"><div class="big">🏆</div><h2>Turnaj skončil!</h2>
      <div class="score">${S.totals[0]} <small>${bodW(S.totals[0])}</small></div>
      <div class="stats">${S.players[0].avatar} ${esc(S.players[0].name)} · ${S.queue.length} ${hraNom(S.queue.length)}</div></div>`;
  }else{
    const hts=[150,110,80];
    const podOrder=[order[1],order[0],order[2]].filter(i=>i!==undefined);
    const tie=place(order[1])===0;
    body=`<div class="panel center"><h2>🏆 ${tie?'Remíza!':'Víťaz turnaja'}</h2>${tie?'':`<div class="score" style="font-size:40px">${S.players[order[0]].avatar} ${esc(S.players[order[0]].name)}</div>`}
      <div class="podium">${podOrder.map(i=>{const pl=place(i);return `<div class="pod" style="--c:${S.players[i].color}">
        <div class="av">${S.players[i].avatar}</div><div class="pn">${esc(S.players[i].name)}</div>
        <div class="st" style="height:${hts[Math.min(pl,2)]}px">${MEDAL[pl]}<small>${S.tpoints[i]} b</small></div></div>`}).join('')}</div>
      <div class="table" style="margin-top:12px">${order.map((i,k)=>`<div class="row" style="--c:${S.players[i].color};animation-delay:${.6+k*.12}s">
        <span class="m">${MEDAL[place(i)]}</span><span class="nm">${S.players[i].avatar} ${esc(S.players[i].name)}</span>
        <span class="pts">${S.tpoints[i]} b</span><span class="sm">(${S.totals[i]} ${bodW(S.totals[i])} v hrách)</span></div>`).join('')}</div></div>`;
  }
  const guest=online()&&!isHost();
  show(`<div class="screen">${body}<div class="btns">${guest
    ?`<div class="panel center"><p class="lead" style="font-weight:600">Hostiteľ môže spustiť nový turnaj…</p></div><button class="link" id="b2">Odpojiť sa</button>`
    :`<button class="primary" id="b1">🏆 Nový turnaj</button><button class="secondary" id="b2">${online()?'Odpojiť sa':'Hlavné menu'}</button>`}</div></div>`);
  confetti(50);tone(523,523,.15,'triangle',.12);tone(659,659,.15,'triangle',.12,.15);tone(784,784,.3,'triangle',.12,.3);
  if(!guest)$('#b1').onclick=()=>{S.mode='tour';if(online())send({t:'nav',a:'pick'});gamesScreen();};
  $('#b2').onclick=online()?askLeave:home;
}

function confetti(k){
  const c=document.createElement('div');c.className='confetti';
  const em=['🎉','✨','🎊','⭐','🪰'];
  for(let i=0;i<k;i++){const s=document.createElement('span');s.textContent=em[i%em.length];
    s.style.left=Math.random()*100+'%';s.style.animationDuration=(2+Math.random()*2.5)+'s';s.style.animationDelay=Math.random()*.8+'s';c.appendChild(s);}
  document.body.appendChild(c);setTimeout(()=>c.remove(),5500);
}

/* ================= HRA: JAŠTERICA =================
   Simulácia beží v pevnom svete 400×500 jednotiek s pevným krokom a
   seedovaným náhodným generátorom → na oboch telefónoch rovnaké muchy. */
function rr(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}
const adiff=(a,b)=>Math.atan2(Math.sin(a-b),Math.cos(a-b));

function runJasterica(player,done,opts={}){
  document.body.classList.add('playing');
  app.style.display='none';cv.style.display='block';quitBtn.style.display='block';
  const dpr=Math.min(2,window.devicePixelRatio||1);
  const WW=400,WH=500,STEP=1/60,DUR=30;
  const R=rngFrom(opts.seed||1);
  let W,H,s,bg,top,sx,sy;
  function makeBg(){
    const b=document.createElement('canvas');b.width=W*dpr;b.height=H*dpr;const g=b.getContext('2d');g.scale(dpr,dpr);
    let gr=g.createLinearGradient(0,0,0,H);gr.addColorStop(0,'#7dd3fc');gr.addColorStop(.55,'#d9f99d');gr.addColorStop(1,'#65a30d');
    g.fillStyle=gr;g.fillRect(0,0,W,H);
    g.fillStyle='rgba(255,236,150,.9)';g.beginPath();g.arc(W-60,130,38,0,Math.PI*2);g.fill();
    g.fillStyle='rgba(255,255,255,.75)';
    [[.18,.2],[.62,.14],[.4,.3]].forEach(([fx,fy])=>{const x=W*fx,y=H*fy;g.beginPath();g.arc(x,y,22,0,7);g.arc(x+26,y-8,26,0,7);g.arc(x+52,y,20,0,7);g.fill();});
    g.fillStyle='#84cc16';g.beginPath();g.moveTo(0,H*.72);g.quadraticCurveTo(W*.3,H*.62,W*.6,H*.7);g.quadraticCurveTo(W*.85,H*.76,W,H*.66);g.lineTo(W,H);g.lineTo(0,H);g.fill();
    g.fillStyle='#4d7c0f';
    for(let i=0;i<W/6;i++){const x=Math.random()*W,y=H*.7+Math.random()*H*.3,h=8+Math.random()*16;g.beginPath();g.moveTo(x-2,y);g.lineTo(x,y-h);g.lineTo(x+2,y);g.fill();}
    const fc=['#f472b6','#fde047','#fff','#c084fc'];
    for(let i=0;i<Math.max(6,W/60);i++){const x=Math.random()*W,y=H*.72+Math.random()*H*.25;g.fillStyle=fc[i%4];
      for(let k=0;k<5;k++){g.beginPath();g.arc(x+Math.cos(k*1.256)*5,y+Math.sin(k*1.256)*5,4,0,7);g.fill();}
      g.fillStyle='#f59e0b';g.beginPath();g.arc(x,y,3,0,7);g.fill();}
    g.fillStyle='#78716c';g.beginPath();g.ellipse(W/2,H+10,190*s,70*s,0,0,7);g.fill();
    g.fillStyle='#a8a29e';g.beginPath();g.ellipse(W/2-20*s,H-5*s,150*s,45*s,0,0,7);g.fill();
    return b;
  }
  function resize(){W=innerWidth;H=innerHeight;cv.width=W*dpr;cv.height=H*dpr;cv.style.width=W+'px';cv.style.height=H+'px';
    s=Math.max(.7,Math.min(1.35,Math.min(W,H)/420));
    top=opts.online?125:100;const bottom=Math.max(top+150,H-200*s);sx=W/WW;sy=(bottom-top)/WH;
    bg=makeBg();}
  resize();addEventListener('resize',resize);
  const X=c=>c.x*sx, Y=c=>top+c.y*sy;

  let time=0,score=0,stats={fly:0,gold:0,bee:0},cr=[],pops=[],tongue=null,shake=0,ouch=0,
      look={x:W/2,y:H/2},nextFly=0,nextBee=2.5+R()*1.5,nextGold=7+R()*5,
      phase='count',countT=3.6,lastCount=4,endT=0,last=performance.now(),acc=0,raf,paused=false,finished=false,clock=0,started=false;
  const mouth=()=>({x:W/2,y:H-48*s});

  function spawnFly(type){
    const left=R()<.5;
    cr.push({type,x:left?-20:WW+20,y:R()*WH,ang:left?0:Math.PI,turn:0,age:0,
      maxAge:type==='gold'?4.5:7+R()*4,r:type==='gold'?13:15,leaving:false,rng:rngFrom(Math.floor(R()*4294967295))});
  }
  function spawnBee(){
    const dir=R()<.5?1:-1;
    cr.push({type:'bee',dir,x:dir>0?-50:WW+50,baseY:30+R()*(WH-80),y:0,age:0,r:24,
      sp:85+time*2.5+R()*40,hover:R()<.55?1+R()*1.2:0,hoverAt:.25+R()*.45});
    tone(240,200,.35,'sawtooth',.035);
  }
  function pop(x,y,text,color){pops.push({x,y,text,color,t:0});}

  function onTap(e){
    if(phase!=='play'||paused||tongue)return;
    const x=e.clientX,y=e.clientY;
    if(y<top-30)return;
    look={x,y};
    tongue={tx:x,ty:y,t:0,state:'out',carry:null};
    tone(500,260,.07,'triangle',.06);
  }
  cv.addEventListener('pointerdown',onTap);

  function hitCheck(tx,ty){
    let best=null,bd=1e9;
    for(const c of cr){if(c.dead)continue;const d=Math.hypot(X(c)-tx,Y(c)-ty)-c.r*s;if(d<20*s&&d<bd){bd=d;best=c;}}
    if(!best)return null;
    best.dead=true;const px=X(best),py=Y(best);
    if(best.type==='fly'){score+=1;stats.fly++;pop(px,py,'+1','#16a34a');tone(700,1300,.12,'square',.06);}
    else if(best.type==='gold'){score+=3;stats.gold++;pop(px,py,'+3','#ca8a04');tone(800,1600,.12,'triangle',.12);tone(1200,2000,.15,'triangle',.1,.1);}
    else{score-=1;stats.bee++;pop(px,py,'−1','#dc2626');ouch=1;shake=.4;tone(220,80,.4,'sawtooth',.13);try{navigator.vibrate&&navigator.vibrate(180)}catch(e){}}
    opts.onScore&&opts.onScore(score);
    return {type:best.type,ang:best.ang,dir:best.dir,r:best.r,x:0,y:0};
  }

  // deterministická časť (rovnaká na oboch telefónoch)
  function step(dt){
    if(phase==='count'){
      countT-=dt;const c=Math.ceil(countT-.6);
      if(c!==lastCount&&c>=0){lastCount=c;tone(c>0?600:900,c>0?600:900,c>0?.12:.25,'sine',.1);}
      if(countT<=0){phase='play';spawnFly('fly');spawnFly('fly');nextFly=1+R()*.6;}
    }else if(phase==='play'){
      time+=dt;
      nextFly-=dt;if(nextFly<=0){spawnFly('fly');nextFly=Math.max(1.05,2.1-time*.035)+R()*.8;}
      nextBee-=dt;if(nextBee<=0){spawnBee();nextBee=Math.max(2.3,4.6-time*.07)+R()*1.6;}
      nextGold-=dt;if(nextGold<=0){spawnFly('gold');nextGold=8+R()*6;}
      if(time>=DUR){phase='end';endT=1.8;tongue=null;tone(523,523,.15,'triangle',.12);tone(392,392,.3,'triangle',.12,.15);}
    }else if(phase==='end'){endT-=dt;}
    for(const c of cr){
      c.age+=dt;
      if(c.type==='bee'){
        let v=c.sp;const prog=(c.dir>0?c.x:WW-c.x)/WW;
        if(c.hover>0&&prog>c.hoverAt){c.hover-=dt;v*=.12;}
        c.x+=c.dir*v*dt;c.y=c.baseY+Math.sin(c.age*3)*35;
        if(c.x<-80||c.x>WW+80)c.gone=true;
      }else{
        const sp=c.type==='gold'?165:75+time*2.6;
        c.turn+=(c.rng()-.5)*22*dt;c.turn=Math.max(-3,Math.min(3,c.turn));c.ang+=c.turn*dt;
        if(c.age>c.maxAge||phase==='end')c.leaving=true;
        if(!c.leaving){
          if(c.x<30||c.x>WW-30||c.y<0||c.y>WH){const ta=Math.atan2(WH/2-c.y,WW/2-c.x);c.ang+=adiff(ta,c.ang)*Math.min(1,dt*6);}
        }else{
          const ta=c.x<WW/2?Math.PI:0;c.ang+=adiff(ta,c.ang)*Math.min(1,dt*3);
          if(c.x<-40||c.x>WW+40||c.y<-150||c.y>WH+150)c.gone=true;
        }
        c.x+=Math.cos(c.ang)*sp*dt;c.y+=Math.sin(c.ang)*sp*dt;
      }
    }
    cr=cr.filter(c=>!c.gone);
  }
  // lokálne efekty
  function fx(dt){
    clock+=dt;
    if(tongue){
      tongue.t+=dt;
      if(tongue.state==='out'&&tongue.t>=.1){tongue.carry=hitCheck(tongue.tx,tongue.ty);tongue.state='in';tongue.t=0;}
      else if(tongue.state==='in'&&tongue.t>=.15)tongue=null;
    }
    pops.forEach(p=>p.t+=dt);pops=pops.filter(p=>p.t<.9);
    shake=Math.max(0,shake-dt);ouch=Math.max(0,ouch-dt);
    if(!tongue){const f=cr.find(c=>c.type!=='bee'&&!c.dead);if(f){look.x+=(X(f)-look.x)*Math.min(1,dt*3);look.y+=(Y(f)-look.y)*Math.min(1,dt*3);}}
  }

  function drawFly(c,x,y){
    const r=c.r*s,gold=c.type==='gold',flap=Math.abs(Math.sin(clock*45+c.r));
    const a=Math.atan2(Math.sin(c.ang||0)*sy,Math.cos(c.ang||0)*sx);
    ctx.save();ctx.translate(x,y);ctx.rotate(a+Math.PI/2);
    ctx.fillStyle=gold?'rgba(255,245,190,.85)':'rgba(225,242,255,.8)';ctx.strokeStyle='rgba(70,90,120,.45)';ctx.lineWidth=1;
    for(const k of[-1,1]){ctx.beginPath();ctx.ellipse(k*r*.6,r*.1,r*.75,r*(.3+.4*flap),k*.5,0,7);ctx.fill();ctx.stroke();}
    if(gold){ctx.shadowColor='#facc15';ctx.shadowBlur=20;}
    ctx.fillStyle=gold?'#eab308':'#374151';ctx.beginPath();ctx.ellipse(0,r*.2,r*.5,r*.78,0,0,7);ctx.fill();ctx.shadowBlur=0;
    ctx.fillStyle=gold?'#a16207':'#111827';ctx.beginPath();ctx.arc(0,-r*.6,r*.42,0,7);ctx.fill();
    ctx.fillStyle='#dc2626';for(const k of[-1,1]){ctx.beginPath();ctx.arc(k*r*.26,-r*.7,r*.2,0,7);ctx.fill();}
    ctx.restore();
  }
  function drawBee(c,x,y){
    const r=c.r*s,flap=Math.abs(Math.sin(clock*40));
    ctx.save();ctx.translate(x,y);ctx.scale(c.dir,1);
    ctx.fillStyle='rgba(230,243,255,.85)';ctx.strokeStyle='rgba(70,90,120,.5)';ctx.lineWidth=1.5;
    ctx.beginPath();ctx.ellipse(-r*.15,-r*.8,r*.45,r*(.22+.35*flap),-.4,0,7);ctx.fill();ctx.stroke();
    ctx.beginPath();ctx.ellipse(r*.25,-r*.78,r*.4,r*(.2+.3*flap),.35,0,7);ctx.fill();ctx.stroke();
    ctx.fillStyle='#111827';ctx.beginPath();ctx.moveTo(-r*.95,-r*.12);ctx.lineTo(-r*1.45,r*.05);ctx.lineTo(-r*.95,r*.2);ctx.fill();
    ctx.save();ctx.beginPath();ctx.ellipse(0,0,r*1.05,r*.72,0,0,7);ctx.fillStyle='#facc15';ctx.fill();ctx.clip();
    ctx.fillStyle='#1f2937';for(const bx of[-.62,-.15,.32])ctx.fillRect(bx*r-r*.12,-r,r*.24,r*2);ctx.restore();
    ctx.strokeStyle='#1f2937';ctx.lineWidth=2;ctx.beginPath();ctx.ellipse(0,0,r*1.05,r*.72,0,0,7);ctx.stroke();
    ctx.fillStyle='#1f2937';ctx.beginPath();ctx.arc(r*.98,-r*.05,r*.45,0,7);ctx.fill();

function runShell(player,done,opts,factory){

      ctx.lineWidth=6;ctx.strokeStyle='#fff';ctx.lineJoin='round';txt(p.text,p.x,p.y-60*E.s*p.t,p.color);ctx.globalAlpha=1;});

function drawMole(x,y,r,k,hit){
  if(k==='jez'){
    ctx.fillStyle='#44403c';
    for(let i=0;i<=12;i++){const a=Math.PI*(1.0+i/12);const b1=a-.16,b2=a+.16;
      ctx.beginPath();ctx.moveTo(x+Math.cos(b1)*r*.78,y+Math.sin(b1)*r*.9);ctx.lineTo(x+Math.cos(a)*r*1.35,y+Math.sin(a)*r*1.4);ctx.lineTo(x+Math.cos(b2)*r*.78,y+Math.sin(b2)*r*.9);ctx.fill();}
  }
  ctx.fillStyle=k==='gold'?'#facc15':k==='jez'?'#78716c':'#7c4a2a';
  ctx.beginPath();ctx.ellipse(x,y,r*.85,r,0,0,7);ctx.fill();
  if(k==='gold'){ctx.fillStyle='#f59e0b';ctx.beginPath();ctx.moveTo(x-r*.5,y-r*.75);ctx.lineTo(x-r*.5,y-r*1.25);ctx.lineTo(x-r*.25,y-r*1.0);ctx.lineTo(x,y-r*1.35);ctx.lineTo(x+r*.25,y-r*1.0);ctx.lineTo(x+r*.5,y-r*1.25);ctx.lineTo(x+r*.5,y-r*.75);ctx.fill();}
  ctx.fillStyle=k==='gold'?'#fef3c7':k==='jez'?'#f5deb3':'#d6a77a';
  ctx.beginPath();ctx.ellipse(x,y+r*.35,r*.58,r*.48,0,0,7);ctx.fill();
  if(hit){ctx.strokeStyle='#111';ctx.lineWidth=Math.max(2,r*.08);ctx.lineCap='round';
    for(const k2 of[-1,1]){const ex=x+k2*r*.32,ey=y-r*.2,q=r*.11;ctx.beginPath();ctx.moveTo(ex-q,ey-q);ctx.lineTo(ex+q,ey+q);ctx.moveTo(ex+q,ey-q);ctx.lineTo(ex-q,ey+q);ctx.stroke();}
    ctx.fillStyle='#fde047';for(let i=0;i<3;i++){const a=E_clock()*6+i*2.1;ctx.beginPath();ctx.arc(x+Math.cos(a)*r*.9,y-r*1.1+Math.sin(a)*r*.2,r*.12,0,7);ctx.fill();}
  }else{
    for(const k2 of[-1,1]){ctx.fillStyle='#111';ctx.beginPath();ctx.arc(x+k2*r*.32,y-r*.2,r*.12,0,7);ctx.fill();
      ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(x+k2*r*.32+r*.04,y-r*.25,r*.04,0,7);ctx.fill();}
    if(k==='jez'){ctx.strokeStyle='#7f1d1d';ctx.lineWidth=Math.max(2,r*.07);for(const k2 of[-1,1]){ctx.beginPath();ctx.moveTo(x+k2*r*.5,y-r*.42);ctx.lineTo(x+k2*r*.18,y-r*.32);ctx.stroke();}}
  }
  ctx.fillStyle=k==='jez'?'#111':'#f472b6';ctx.beginPath();ctx.arc(x,y+r*.18,r*.15,0,7);ctx.fill();
  if(k!=='jez'){ctx.fillStyle='#fff';ctx.fillRect(x-r*.11,y+r*.4,r*.22,r*.16);ctx.strokeStyle='#d6a77a';ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(x,y+r*.4);ctx.lineTo(x,y+r*.56);ctx.stroke();}
}
let _clockRef=null;const E_clock=()=>_clockRef?_clockRef.clock:0;

function fKrtko(E){
  _clockRef=E;
  const holes=Array.from({length:9},()=>({k:null,t:0,dur:0,hit:false,ht:0}));
  let next=.3,L=[],hr=40;
  const rise=h=>Math.max(0,Math.min(1,h.t/.12,(h.dur-h.t)/.12));
  return {dur:30,hint:'Bácni krtka, ježka nie!',
    layout(){const ah=E.bottom-E.top-10,cw=E.W/3,ch=ah/3;hr=Math.min(cw*.36,ch*.3);L=[];
      for(let r=0;r<3;r++)for(let c=0;c<3;c++)L.push({x:cw*(c+.5),y:E.top+10+ch*(r+.68)});},
    bg(g){skyBg(g,E.W,E.H,'#bbf7d0','#4ade80');g.fillStyle='rgba(21,128,61,.3)';
      for(let i=0;i<E.W*E.H/700;i++){const x=Math.random()*E.W,y=Math.random()*E.H;g.fillRect(x,y,2,7);}
      L.forEach(p=>{g.fillStyle='#a16207';g.beginPath();g.ellipse(p.x,p.y+hr*.1,hr*1.3,hr*.55,0,0,7);g.fill();});},
    step(dt){
      for(const h of holes)if(h.k){h.t+=dt;if(h.t>=h.dur)h.k=null;}
      next-=dt;
      if(next<=0){
        const a=E.R(),b=E.R(),c=E.R(),d=E.R();
        const free=[];holes.forEach((h,i)=>{if(!h.k)free.push(i);});
        if(free.length){const h=holes[free[Math.floor(a*free.length)]];
          h.k=b<.17?'jez':b<.25?'gold':'mole';h.t=0;h.hit=false;h.ht=0;
          h.dur=h.k==='gold'?.8+c*.25:Math.max(.75,1.4-E.time*.02)+c*.45;}
        next=Math.max(.3,.8-E.time*.016)+d*.35;
      }
    },
    fx(dt){for(const h of holes)if(h.hit)h.ht+=dt;},
    tap(x,y){
      let best=-1,bd=1e9;
      holes.forEach((h,i)=>{if(!h.k||h.hit||rise(h)<.35)return;const p=L[i];const d=Math.hypot(x-p.x,y-(p.y-hr*.8));if(d<hr*1.5&&d<bd){bd=d;best=i;}});
      if(best<0){tone(260,180,.05,'triangle',.04);return;}
      const h=holes[best],p=L[best];h.hit=true;h.ht=0;
      if(h.k==='mole'){E.add(1,p.x,p.y-hr*1.6);E.stat('mole');tone(420,160,.12,'square',.08);}
      else if(h.k==='gold'){E.add(3,p.x,p.y-hr*1.6,null,'#ca8a04');E.stat('gold');tone(800,1600,.12,'triangle',.12);tone(1200,2000,.15,'triangle',.1,.1);}
      else{E.add(-1,p.x,p.y-hr*1.6);E.stat('jez');}
    },
    draw(){
      holes.forEach((h,i)=>{const p=L[i];
        ctx.fillStyle='#1c1917';ctx.beginPath();ctx.ellipse(p.x,p.y,hr*.98,hr*.36,0,0,7);ctx.fill();
        if(h.k&&!(h.hit&&h.ht>.4)){

    }};
}

/* ---------------- BALÓNIKY ---------------- */
function fBalony(E){
  const COL=['#ef4444','#3b82f6','#f59e0b','#a855f7','#ec4899','#14b8a6'];
  let bs=[],next=.2,parts=[];
  const pos=b=>({x:b.x/400*E.W+Math.sin(b.ph+b.age*b.sw)*14*E.s,y:E.bottom+50*E.s-b.u*(E.bottom-E.top+100*E.s)});
  return {dur:30,hint:'Praskaj balóny, čierne nie!',
    bg(g){skyBg(g,E.W,E.H,'#38bdf8','#e0f2fe');clouds(g,E.W,E.H);
      g.fillStyle='#86efac';g.beginPath();g.moveTo(0,E.H-30);g.quadraticCurveTo(E.W/2,E.H-70,E.W,E.H-30);g.lineTo(E.W,E.H);g.lineTo(0,E.H);g.fill();},
    step(dt){
      for(const b of bs){b.u+=b.v*dt;b.age+=dt;}
      bs=bs.filter(b=>b.u<1.12);
      next-=dt;
      if(next<=0){
        const a=E.R(),k=E.R(),c=E.R(),v=E.R();
        const kind=k<.17?'black':k<.3?'small':'b';
        bs.push({x:35+a*330,u:0,age:0,v:(kind==='small'?.3:.19)+E.time*.006+v*.06,kind,col:COL[Math.floor(c*COL.length)],ph:a*10,sw:1+c,popped:false,r:kind==='small'?21:31});
        next=Math.max(.32,.72-E.time*.012)+v*.3;
      }
    },
    fx(dt){parts.forEach(p=>{p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=500*dt;p.t+=dt;});parts=parts.filter(p=>p.t<.6);},
    tap(x,y){
      let best=null,bd=1e9;
      for(const b of bs){if(b.popped)continue;const p=pos(b);const d=Math.hypot(x-p.x,y-p.y)-b.r*E.s;if(d<16*E.s&&d<bd){bd=d;best=b;}}
      if(!best){tone(260,180,.04,'triangle',.03);return;}
      best.popped=true;const p=pos(best);
      for(let i=0;i<12;i++){const a=i/12*6.28;parts.push({x:p.x,y:p.y,vx:Math.cos(a)*220*E.s,vy:Math.sin(a)*220*E.s,t:0,c:best.kind==='black'?'#1f2937':best.col});}
      if(best.kind==='b'){E.add(1,p.x,p.y);E.stat('b');tone(900,300,.08,'square',.08);}
      else if(best.kind==='small'){E.add(2,p.x,p.y);E.stat('small');tone(1200,400,.08,'square',.08);}
      else{E.add(-1,p.x,p.y);E.stat('black');}
    },
    draw(){
      for(const b of bs){if(b.popped)continue;const p=pos(b),r=b.r*E.s;
        ctx.strokeStyle='rgba(55,65,81,.6)';ctx.lineWidth=1.5;ctx.beginPath();ctx.moveTo(p.x,p.y+r);
        ctx.quadraticCurveTo(p.x+8*Math.sin(b.age*3),p.y+r*1.8,p.x,p.y+r*2.6);ctx.stroke();
        ctx.fillStyle=b.kind==='black'?'#1f2937':b.col;
        ctx.beginPath();ctx.ellipse(p.x,p.y,r*.86,r,0,0,7);ctx.fill();
        ctx.beginPath();ctx.moveTo(p.x,p.y+r*.95);ctx.lineTo(p.x-r*.14,p.y+r*1.15);ctx.lineTo(p.x+r*.14,p.y+r*1.15);ctx.fill();
        ctx.fillStyle='rgba(255,255,255,.45)';ctx.beginPath();ctx.ellipse(p.x-r*.32,p.y-r*.38,r*.16,r*.28,-.5,0,7);ctx.fill();
        if(b.kind==='black'){ctx.fillStyle='#fff';ctx.font=FONT(r*1.0);ctx.fillText('☠',p.x,p.y+r*.05);}
        if(b.kind==='small'){ctx.fillStyle='#fff';ctx.font=FONT(r*.75);ctx.fillText('2',p.x,p.y+r*.05);}
      }
      parts.forEach(p=>{ctx.globalAlpha=1-p.t/.6;ctx.fillStyle=p.c;ctx.fillRect(p.x-4,p.y-4,8,8);ctx.globalAlpha=1;});
    }};
}

/* ---------------- PEXESO ---------------- */
function fPexeso(E){
  const EM=['🐶','🐱','🦊','🐸','🐵','🐷','🐰','🐻','🦁','🐮','🐔','🐧','🐙','🦄','🐢','🐞'];
  let cards=[],open=[],lock=0,boardT=0,L={};
  function newBoard(){
    const pool=EM.slice(),pick=[];
    for(let i=0;i<8;i++)pick.push(pool.splice(Math.floor(E.R()*pool.length),1)[0]);
    const deck=pick.concat(pick);
    for(let i=deck.length-1;i>0;i--){const j=Math.floor(E.R()*(i+1));[deck[i],deck[j]]=[deck[j],deck[i]];}
    cards=deck.map(e=>({e,up:false,done:false,f:0,pop:0}));open=[];
  }
  newBoard();
  return {dur:45,hint:'Nájdi rovnaké dvojice!',
    layout(){const ah=E.bottom-E.top-10,aw=E.W-16;let cw=aw/4,ch=ah/4;if(cw/ch>.85)cw=ch*.85;else ch=cw/.85;
      L={cw,ch,x0:(E.W-cw*4)/2,y0:E.top+6+(ah-ch*4)/2};},
    bg(g){skyBg(g,E.W,E.H,'#fef3c7','#fbcfe8');},
    fx(dt){
      cards.forEach(c=>{const t=(c.up||c.done)?1:0;c.f+=(t-c.f)*Math.min(1,dt*14);if(c.pop>0)c.pop-=dt;});
      if(lock>0){lock-=dt;if(lock<=0){open.forEach(i=>cards[i].up=false);open=[];}}
      if(boardT>0){boardT-=dt;if(boardT<=0)newBoard();}
    },
    tap(x,y){
      if(boardT>0)return;
      if(lock>0){lock=0;open.forEach(i=>cards[i].up=false);open=[];}
      const c=Math.floor((x-L.x0)/L.cw),r=Math.floor((y-L.y0)/L.ch);
      if(c<0||c>3||r<0||r>3)return;
      const i=r*4+c,cd=cards[i];if(cd.up||cd.done)return;
      cd.up=true;open.push(i);tone(600,700,.05,'triangle',.06);
      if(open.length===2){
        const[a,b]=open;
        if(cards[a].e===cards[b].e){
          cards[a].done=cards[b].done=true;cards[a].pop=cards[b].pop=.35;open=[];
          E.add(1,x,y);E.stat('pairs');tone(700,1300,.14,'square',.06);
          if(cards.every(k=>k.done)){E.add(3,E.W/2,(E.top+E.bottom)/2,'+3 hotovo!','#7c3aed');E.stat('boards');boardT=1;
            tone(523,523,.12,'triangle',.12);tone(659,659,.12,'triangle',.12,.12);tone(784,784,.2,'triangle',.12,.24);}
        }else lock=.8;
      }
    },
    draw(){
      cards.forEach((cd,i)=>{
        const c=i%4,r=Math.floor(i/4),x=L.x0+c*L.cw+L.cw/2,y=L.y0+r*L.ch+L.ch/2,w=L.cw-10,h=L.ch-10;
        const sc=Math.max(.02,Math.abs(Math.cos(cd.f*Math.PI))),face=cd.f>.5,pp=1+Math.max(0,cd.pop)*.35;
        ctx.save();ctx.translate(x,y);ctx.scale(sc*pp,pp);
        ctx.fillStyle='rgba(0,0,0,.12)';rr(-w/2,-h/2+4,w,h,12);ctx.fill();
        ctx.fillStyle=face?(cd.done?'#dcfce7':'#fff'):'#7c3aed';rr(-w/2,-h/2,w,h,12);ctx.fill();
        if(face){ctx.font=`${Math.round(Math.min(w,h)*.58)}px system-ui,"Noto Color Emoji",sans-serif`;ctx.fillStyle='#000';ctx.fillText(cd.e,0,h*.04);}
        else{ctx.strokeStyle='rgba(255,255,255,.35)';ctx.lineWidth=3;rr(-w/2+6,-h/2+6,w-12,h-12,8);ctx.stroke();
          ctx.fillStyle='rgba(255,255,255,.85)';ctx.font=FONT(Math.min(w,h)*.45);ctx.fillText('?',0,h*.04);}
        ctx.restore();
      });
    }};
}

/* ---------------- ŽABÍ SKOK ---------------- */
function fZaba(E){
  const lanes=[];
  for(let i=1;i<=5;i++)lanes.push({dir:i%2?1:-1,base:38+E.R()*32,w:105+E.R()*40,per:235+E.R()*90,pos:E.R()*400});
  const fr={row:0,from:0,x:200,state:'idle',t:0};
  let rowH=60;
  const SX=x=>x/400*E.W,yOf=r=>E.bottom-(r+.5)*rowH;
  const vel=l=>l.dir*l.base*(1+E.time*.025);
  function pads(l){const p=((l.pos%l.per)+l.per)%l.per,out=[];for(let k=-1;k<=Math.ceil(400/l.per)+1;k++)out.push(p+k*l.per-l.per);return out;}
  const onPad=(l,x)=>pads(l).some(px=>x>=px-8&&x<=px+l.w+8);
  function splash(){fr.state='fall';fr.t=0;E.add(-1,SX(fr.x),yOf(fr.row)-rowH*.4,'💦 −1');E.stat('fall');}
  function land(){
    if(fr.row===6){E.add(3,SX(fr.x),yOf(6)-rowH*.3,'+3 breh!','#7c3aed');E.stat('bank');fr.state='bank';fr.t=0;
      tone(523,523,.1,'triangle',.12);tone(784,784,.18,'triangle',.12,.1);return;}
    if(onPad(lanes[fr.row-1],fr.x)){E.add(1,SX(fr.x),yOf(fr.row)-rowH*.5);E.stat('jump');tone(500,900,.08,'sine',.08);}
    else splash();
  }
  function drawFrog(x,y,sc,jump){
    const r=rowH*.32*sc;
    ctx.fillStyle='#15803d';
    for(const k of[-1,1]){ctx.beginPath();ctx.ellipse(x+k*r*.85,y+r*.45,r*(jump?.25:.45),r*(jump?.7:.3),k*(jump?.4:.2),0,7);ctx.fill();}
    ctx.fillStyle='#22c55e';ctx.beginPath();ctx.ellipse(x,y,r*.9,r*.8,0,0,7);ctx.fill();
    ctx.fillStyle='#86efac';ctx.beginPath();ctx.ellipse(x,y+r*.25,r*.55,r*.4,0,0,7);ctx.fill();
    for(const k of[-1,1]){ctx.fillStyle='#22c55e';ctx.beginPath();ctx.arc(x+k*r*.45,y-r*.6,r*.32,0,7);ctx.fill();
      ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(x+k*r*.45,y-r*.62,r*.22,0,7);ctx.fill();
      ctx.fillStyle='#111';ctx.beginPath();ctx.arc(x+k*r*.45,y-r*.68,r*.11,0,7);ctx.fill();}
    ctx.strokeStyle='#14532d';ctx.lineWidth=2;ctx.beginPath();ctx.arc(x,y-r*.1,r*.4,.3,Math.PI-.3);ctx.stroke();
  }
  return {dur:30,hint:'Ťukni = skok. Skáč po lekninách!',
    layout(){rowH=(E.bottom-E.top)/7;},
    bg(g){
      skyBg(g,E.W,E.H,'#bae6fd','#bae6fd');
      const wt=yOf(5)-rowH/2,wb=yOf(1)+rowH/2;
      const gr=g.createLinearGradient(0,wt,0,wb);gr.addColorStop(0,'#38bdf8');gr.addColorStop(1,'#0284c7');g.fillStyle=gr;g.fillRect(0,wt,E.W,wb-wt);
      g.strokeStyle='rgba(255,255,255,.25)';g.lineWidth=2;
      for(let i=0;i<40;i++){const x=Math.random()*E.W,y=wt+Math.random()*(wb-wt);g.beginPath();g.moveTo(x,y);g.quadraticCurveTo(x+8,y-4,x+16,y);g.stroke();}
      g.fillStyle='#65a30d';g.fillRect(0,wb,E.W,E.H-wb);g.fillRect(0,0,E.W,wt);
      g.fillStyle='#4d7c0f';for(let i=0;i<E.W/5;i++){for(const y0 of[wt-rowH*.9,wb+rowH*.2]){const x=Math.random()*E.W,y=y0+Math.random()*rowH*.6;g.fillRect(x,y,2,8);}}
      g.font=FONT(rowH*.32);g.textAlign='center';g.textBaseline='middle';g.fillStyle='rgba(255,255,255,.9)';g.fillText('🏁 Cieľ +3',E.W/2,yOf(6));
    },
    step(dt){for(const l of lanes)l.pos+=vel(l)*dt;},
    fx(dt){
      fr.t+=dt;
      if(fr.state==='jump'&&fr.t>=.22){fr.state='idle';land();}
      else if(fr.state==='fall'&&fr.t>=.7){fr.state='idle';fr.row=0;fr.from=0;fr.x=200;}
      else if(fr.state==='bank'&&fr.t>=.5){fr.state='idle';fr.row=0;fr.from=0;fr.x=200;}
      if(fr.state==='idle'&&fr.row>=1&&fr.row<=5){
        const l=lanes[fr.row-1];fr.x+=vel(l)*dt;
        if(fr.x<6||fr.x>394||!onPad(l,fr.x))splash();
      }
    },
    tap(){if(fr.state!=='idle')return;fr.from=fr.row;fr.row++;fr.state='jump';fr.t=0;tone(300,620,.1,'sine',.08);},
    draw(){
      lanes.forEach((l,i)=>{const y=yOf(i+1);
        for(const px of pads(l)){const n=Math.max(1,Math.round(l.w/48)),seg=l.w/n;
          for(let k=0;k<n;k++){const cx=SX(px+seg*(k+.5)),r=Math.min(SX(seg)*.62,rowH*.4);
            ctx.fillStyle='#16a34a';ctx.beginPath();ctx.moveTo(cx,y);ctx.arc(cx,y,r,.35+k,.35+k+5.6);ctx.closePath();ctx.fill();
            ctx.strokeStyle='rgba(20,83,45,.5)';ctx.lineWidth=1.5;ctx.beginPath();ctx.arc(cx,y,r*.6,0,7);ctx.stroke();}
          if(Math.abs(l.w-130)<6){ctx.fillStyle='#f9a8d4';ctx.beginPath();ctx.arc(SX(px+l.w*.3),y-rowH*.12,rowH*.1,0,7);ctx.fill();}
        }
      });
      let x=SX(fr.x),y=yOf(fr.row),sc=1,jump=false;
      if(fr.state==='jump'){const p=Math.min(1,fr.t/.22);y=yOf(fr.from)+(yOf(fr.row)-yOf(fr.from))*p-Math.sin(p*Math.PI)*rowH*.5;sc=1+Math.sin(p*Math.PI)*.3;jump=true;}
      if(fr.state==='fall'){const p=Math.min(1,fr.t/.7);
        ctx.strokeStyle='rgba(255,255,255,.8)';ctx.lineWidth=3;for(let k=0;k<3;k++){ctx.beginPath();ctx.ellipse(x,y,rowH*(.2+p*.5+k*.15),rowH*(.08+p*.18+k*.05),0,0,7);ctx.stroke();}
        if(p<.5)drawFrog(x,y+p*rowH*.4,1-p*1.6,false);
      }else drawFrog(x,y,sc,jump);
      if(fr.row===0&&fr.state==='idle'&&E.time<4){ctx.font=FONT(18*E.s);ctx.lineWidth=5;ctx.strokeStyle='#fff';txt('👆 Ťukni kdekoľvek',E.W/2,yOf(0)-rowH*.55,'#14532d');}
    }};
}

/* ---------------- RYBÁR ---------------- */
function fRybar(E){
  const COL=['#f97316','#06b6d4','#8b5cf6','#ef4444','#22c55e'];
  let fish=[],next=.1,hook={st:'idle',x:200,y:0,carry:null},L={sx:1,sy:1,surf:200};
  const boatX=()=>200+150*Math.sin(E.time*.9);
  const SX=x=>x*L.sx,SY=y=>L.surf+y*L.sy;
  function drawFish(f,x,y){
    const r=f.size*E.s;

      ctx.strokeStyle='rgba(236,72,153,.7)';ctx.lineWidth=3;
      for(let k=-2;k<=2;k++){ctx.beginPath();ctx.moveTo(x+k*r*.3,y);ctx.quadraticCurveTo(x+k*r*.3+Math.sin(E.clock*6+k)*6,y+r*.9,x+k*r*.3,y+r*1.6);ctx.stroke();}
      ctx.fillStyle='rgba(244,114,182,.9)';ctx.beginPath();ctx.ellipse(x,y,r*1.05,r*.8,0,Math.PI,0);ctx.closePath();ctx.fill();
      ctx.fillStyle='#831843';for(const k of[-1,1]){ctx.beginPath();ctx.arc(x+k*r*.35,y-r*.3,r*.1,0,7);ctx.fill();}
      return;
    }
    ctx.save();ctx.translate(x,y);ctx.scale(f.dir,1);
    if(f.kind==='gold'){ctx.shadowColor='#facc15';ctx.shadowBlur=18;}
    ctx.fillStyle=f.kind==='gold'?'#facc15':f.col;
    ctx.beginPath();ctx.moveTo(-r*.9,0);ctx.lineTo(-r*1.6,-r*.6);ctx.lineTo(-r*1.6,r*.6);ctx.closePath();ctx.fill();
    ctx.beginPath();ctx.ellipse(0,0,r*1.1,r*.65,0,0,7);ctx.fill();ctx.shadowBlur=0;
    ctx.fillStyle='rgba(255,255,255,.35)';ctx.beginPath();ctx.ellipse(-r*.1,r*.2,r*.6,r*.2,0,0,7);ctx.fill();
    ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(r*.55,-r*.15,r*.2,0,7);ctx.fill();
    ctx.fillStyle='#111';ctx.beginPath();ctx.arc(r*.6,-r*.15,r*.1,0,7);ctx.fill();
    ctx.restore();
  }
  return {dur:30,hint:'Ťukni = spustiť háčik. Medúzu nie!',
    layout(){L.surf=E.top+(E.bottom-E.top)*.17;L.sx=E.W/400;L.sy=(E.bottom-L.surf-30)/500;},
    bg(g){
      skyBg(g,E.W,L.surf,'#7dd3fc','#e0f2fe');
      const gr=g.createLinearGradient(0,L.surf,0,E.H);gr.addColorStop(0,'#0ea5e9');gr.addColorStop(1,'#1e3a8a');g.fillStyle=gr;g.fillRect(0,L.surf,E.W,E.H-L.surf);
      g.fillStyle='#fde68a';g.beginPath();g.moveTo(0,E.H-24);for(let x=0;x<=E.W;x+=40)g.quadraticCurveTo(x+20,E.H-34,x+40,E.H-24);g.lineTo(E.W,E.H);g.lineTo(0,E.H);g.fill();
      g.strokeStyle='#15803d';g.lineWidth=5;g.lineCap='round';
      for(let i=0;i<7;i++){const x=Math.random()*E.W,h=40+Math.random()*60;g.beginPath();g.moveTo(x,E.H-24);g.quadraticCurveTo(x+15,E.H-24-h/2,x,E.H-24-h);g.stroke();}
      g.fillStyle='rgba(255,255,255,.35)';for(let i=0;i<20;i++){g.beginPath();g.arc(Math.random()*E.W,L.surf+Math.random()*(E.H-L.surf),2+Math.random()*4,0,7);g.fill();}
    },
    step(dt){
      for(const f of fish){f.age+=dt;f.x+=f.dir*f.sp*(1+E.time*.02)*dt;if(f.kind==='jelly')f.y=f.by+Math.sin(f.age*2)*25;if(f.x<-60||f.x>460)f.gone=true;}
      fish=fish.filter(f=>!f.gone);
      next-=dt;
      if(next<=0){
        const a=E.R(),b=E.R(),c=E.R(),d=E.R();
        const kind=b<.2?'jelly':b<.29?'gold':'fish',dir=a<.5?1:-1;
        fish.push({kind,dir,x:dir>0?-40:440,y:50+c*420,by:50+c*420,age:0,sp:kind==='gold'?150:kind==='jelly'?40:55+d*65,size:kind==='jelly'?20:kind==='gold'?14:13+d*9,col:COL[Math.floor(d*COL.length)],caught:false});
        next=E.time<1?.35:Math.max(.42,1-E.time*.016)+d*.4;
      }
    },
    fx(dt){
      if(hook.st==='down'){
        hook.y+=520*dt;
        const hx=SX(hook.x),hy=SY(hook.y);
        for(const f of fish){if(f.caught)continue;if(Math.hypot(SX(f.x)-hx,SY(f.y)-hy)<f.size*E.s+12*E.s){
          f.caught=true;hook.carry=f;hook.st='up';
          if(f.kind==='fish'){E.add(1,hx,hy);E.stat('fish');tone(600,1100,.12,'square',.06);}
          else if(f.kind==='gold'){E.add(3,hx,hy,null,'#ca8a04');E.stat('gold');tone(800,1600,.12,'triangle',.12);tone(1200,2000,.15,'triangle',.1,.1);}
          else{E.add(-1,hx,hy,'⚡ −1');E.stat('jelly');}
          break;}}
        if(hook.y>=500)hook.st='up';
      }else if(hook.st==='up'){hook.y-=700*dt;if(hook.y<=0){hook.st='idle';hook.carry=null;hook.y=0;}}
    },
    tap(){if(hook.st!=='idle')return;hook.st='down';hook.x=boatX();hook.y=0;tone(500,250,.1,'sine',.07);},
    draw(){
      for(const f of fish)if(!f.caught)drawFish(f,SX(f.x),SY(f.y));
      const bx=SX(boatX()),by=L.surf,s=E.s;
      const tipX=bx+40*s,tipY=by-62*s;
      if(hook.st!=='idle'){const hx=SX(hook.x),hy=SY(hook.y);
        ctx.strokeStyle='#e5e7eb';ctx.lineWidth=1.5;ctx.beginPath();ctx.moveTo(tipX,tipY);ctx.lineTo(hx,hy);ctx.stroke();
        ctx.strokeStyle='#475569';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(hx,hy-8*s);ctx.lineTo(hx,hy+6*s);ctx.arc(hx-6*s,hy+6*s,6*s,0,Math.PI*.9);ctx.stroke();
        if(hook.carry)drawFish(hook.carry,hx,hy+14*s);
      }else{ctx.strokeStyle='#e5e7eb';ctx.lineWidth=1.5;ctx.beginPath();ctx.moveTo(tipX,tipY);ctx.lineTo(tipX,by+10*s);ctx.stroke();}
      ctx.fillStyle='#fcd34d';ctx.beginPath();ctx.arc(bx-8*s,by-38*s,10*s,0,7);ctx.fill();
      ctx.fillStyle='#2563eb';ctx.fillRect(bx-16*s,by-28*s,16*s,18*s);
      ctx.fillStyle='#dc2626';ctx.beginPath();ctx.ellipse(bx-8*s,by-46*s,12*s,5*s,0,0,7);ctx.fill();
      ctx.strokeStyle='#78350f';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(bx,by-22*s);ctx.lineTo(tipX,tipY);ctx.stroke();
      ctx.fillStyle='#92400e';ctx.beginPath();ctx.moveTo(bx-46*s,by-14*s);ctx.lineTo(bx+46*s,by-14*s);ctx.lineTo(bx+32*s,by+8*s);ctx.lineTo(bx-32*s,by+8*s);ctx.closePath();ctx.fill();
      ctx.strokeStyle='rgba(255,255,255,.7)';ctx.lineWidth=2;ctx.beginPath();
      for(let x=0;x<=E.W;x+=10)ctx.lineTo(x,by+Math.sin(x*.05+E.clock*3)*3);ctx.stroke();
      if(E.time<4&&hook.st==='idle'){ctx.font=FONT(18*E.s);ctx.lineWidth=5;ctx.strokeStyle='#fff';txt('👆 Ťukni a háčik spadne dolu',E.W/2,by+40*s,'#1e3a8a');}
    }};
}

/* ---------------- REFLEX ---------------- */
function fReflex(E){
  let st='idle',t=0,delay=1,decoy=false,goAt=0,msg='',msgT=0,msgC='#1f2937',best=null;
  function newRound(){delay=.9+E.R()*1.8;decoy=E.R()<.25;st='wait';t=0;}
  const C=()=>({x:E.W/2,y:E.top+(E.bottom-E.top)*.42,r:Math.min(E.W*.4,(E.bottom-E.top)*.3)});
  function say(m,c){msg=m;msgC=c||'#1f2937';msgT=1;}
  return {dur:30,hint:'Ťukni, keď zasvieti zelená!',
    bg(g){skyBg(g,E.W,E.H,'#e0e7ff','#c7d2fe');},
    start(){newRound();},
    fx(dt){
      if(E.phase!=='play')return;
      t+=dt;msgT-=dt;
      if(st==='wait'&&t>=delay){st=decoy?'decoy':'go';t=0;goAt=performance.now();tone(decoy?260:880,decoy?240:880,.15,decoy?'sawtooth':'sine',.1);}
      else if(st==='go'&&t>=1.3){say('Pomaly! 🐢','#b45309');st='pause';t=0;}
      else if(st==='decoy'&&t>=1){say('Dobre, vydržal si! 👍','#15803d');st='pause';t=0;}
      else if(st==='pause'&&t>=.6)newRound();
    },
    tap(){
      const c=C();
      if(st==='wait'){E.add(-1,c.x,c.y-c.r*.4,'Skoro! −1');E.stat('early');say('Príliš skoro!','#b91c1c');st='pause';t=0;}
      else if(st==='go'){
        const ms=Math.round(performance.now()-goAt),p=ms<350?3:ms<600?2:1;
        E.add(p,c.x,c.y-c.r*.4);E.stat('hits');best=best==null?ms:Math.min(best,ms);E.stats.best=best;
        say(ms+' ms',p===3?'#15803d':'#1f2937');st='pause';t=0;tone(700,1300,.12,'square',.06);
      }else if(st==='decoy'){E.add(-1,c.x,c.y-c.r*.4);E.stat('decoy');say('To bola včela! 🐝','#b91c1c');st='pause';t=0;}
    },
    draw(){
      const c=C();
      const col=st==='go'?'#22c55e':st==='decoy'?'#facc15':st==='wait'?'#ef4444':'#9ca3af';
      ctx.fillStyle='rgba(0,0,0,.12)';ctx.beginPath();ctx.arc(c.x,c.y+8,c.r,0,7);ctx.fill();
      ctx.fillStyle=col;ctx.beginPath();ctx.arc(c.x,c.y,c.r,0,7);ctx.fill();
      ctx.fillStyle='rgba(255,255,255,.25)';ctx.beginPath();ctx.ellipse(c.x-c.r*.35,c.y-c.r*.4,c.r*.3,c.r*.18,-.6,0,7);ctx.fill();
      if(st==='decoy'){ctx.fillStyle='#1f2937';for(const k of[-.45,0,.45])ctx.fillRect(c.x+k*c.r-c.r*.1,c.y-c.r*.86,c.r*.2,c.r*1.72);
        ctx.font=FONT(c.r*.42);ctx.lineWidth=8;ctx.strokeStyle='#fff';txt('🐝 NIE!',c.x,c.y,'#b91c1c');}
      else{ctx.font=FONT(c.r*(st==='go'?.42:.28));ctx.fillStyle='#fff';
        ctx.fillText(st==='go'?'TERAZ!':st==='wait'?'Čakaj…':'',c.x,c.y);}
      if(msgT>0){ctx.globalAlpha=Math.min(1,msgT*2);ctx.font=FONT(30*E.s);ctx.lineWidth=6;ctx.strokeStyle='#fff';txt(msg,c.x,c.y+c.r+40*E.s,msgC);ctx.globalAlpha=1;}
      ctx.font=FONT(16*E.s);ctx.fillStyle='#3730a3';
      ctx.fillText('do 350 ms = 3 b · do 600 ms = 2 b · inak 1 b',c.x,E.bottom-46*E.s);
      ctx.fillText(best!=null?'Najlepší čas: '+best+' ms':'Na červenú a včelu neťukaj!',c.x,E.bottom-20*E.s);
    }};
}

function makeTrack(seed){
  const R=rngFrom(seed),p1=R()*6.28,p2=R()*6.28,objs=[],LAN=[-72,0,72];
  const cx=d=>{const a=Math.max(0,Math.min(1,(d-300)/2200));return 200+a*(48*Math.sin(d/520+p1)+26*Math.sin(d/215+p2));};
  for(let d=700;d<32000;d+=250){
    const r=R(),lane=Math.floor(R()*3),e=R();
    if(r<.36){for(let k=0;k<3;k++)objs.push({t:'star',d:d+k*55,off:LAN[lane]});}
    else if(r<.68){objs.push({t:'car',d,off:LAN[lane],v:70+e*70,ci:Math.floor(e*5)});
      if(e>.55)objs.push({t:'star',d:d+40,off:LAN[(lane+1)%3]});}
    else if(r<.76)objs.push({t:'oil',d,off:LAN[lane]});
    else if(r<.84)objs.push({t:'nitro',d,off:LAN[lane]});
    else if(r<.90)objs.push({t:'gold',d,off:LAN[lane]});
  }
  return {cx,objs};
}

function drawStar(x,y,r,col){

function runAuta(entries,done,opts={}){
  document.body.classList.add('playing');
  app.style.display='none';cv.style.display='block';quitBtn.style.display='block';
  const dpr=Math.min(2,window.devicePixelRatio||1),STEP=1/60,DUR=40,split=entries.length>1,RW=118,GATE=3000;
  const seed=opts.seed||1,T=makeTrack(seed),hs=(seed%1000)/7;
  const TC=['#f8fafc','#fb923c','#22c55e','#a78bfa','#facc15'].map(col=>({id:'t',w:42,l:78,col,dark:'#475569'}));
  const BIO=[{g:'#69b84f',a:'#3f8f35',b:'#57a843'},{g:'#e6c57c',a:'#5f9a4a',b:'#7fb866'},{g:'#eef3f8',a:'#3d7a5a',b:'#ffffff'},{g:'#d9a05b',a:'#c2571f',b:'#e9a23b'}];
  const Ps=entries.map((e,i)=>({i,p:e.p,car:CARS[e.car]||CARS[0],x:200+(split?(i?45:-45):0),d:0,v:0,score:0,
    stats:{star:0,gold:0,crash:0,dist:0},target:null,pid:null,nitro:0,spin:0,inv:0,ang:0,on:true,
    flags:new Uint8Array(T.objs.length),gate:0,pops:[],shake:0}));
  let W,H,VW,VH,k,carY;
  function resize(){
    W=innerWidth;H=innerHeight;cv.width=W*dpr;cv.height=H*dpr;cv.style.width=W+'px';cv.style.height=H+'px';
    VW=W;VH=split?H/2:H;k=Math.min(VW/400,VH/640);carY=VH-Math.max(64,VH*.17);
    if(split){quitBtn.style.left=(W/2-22)+'px';quitBtn.style.right='auto';quitBtn.style.top=(H/2-22)+'px';}
  }
  resize();addEventListener('resize',resize);
  let time=0,clock=0,phase='count',countT=3.6,lastCount=4,endT=0,last=performance.now(),acc=0,raf,paused=false,finished=false;

  function add(P,n,text,color){
    P.score+=n;P.pops.push({t:0,text:text||((n>0?'+':'−')+Math.abs(n)),color:color||(n>0?'#16a34a':'#dc2626')});
    if(P.i===0&&opts.onScore)opts.onScore(P.score);
  }
  function stepP(P,dt){
    const c=P.car,cx=T.cx(P.d);
    P.on=Math.abs(P.x-cx)<RW-c.w*.25;
    const vb=(330+c.spd*26)*(1+time*.006);
    const tv=vb*(P.nitro>0?1.45:1)*(P.on?1:.4+.06*c.tgh);
    P.v+=(tv-P.v)*Math.min(1,dt*(tv>P.v?1.3:3));
    if(P.spin>0){P.spin-=dt;P.ang+=dt*15;if(P.spin<=0)P.ang=0;}
    else if(P.target!=null){
      const dx=P.target-P.x,m=(170+c.hnd*55)*dt;
      P.x+=Math.max(-m,Math.min(m,dx));
      const lean=Math.max(-1,Math.min(1,dx/45))*.28;P.ang+=(lean-P.ang)*Math.min(1,dt*12);
    }else P.ang+=(0-P.ang)*Math.min(1,dt*12);
    P.x=Math.max(10,Math.min(390,P.x));
    P.d+=P.v*dt;P.nitro-=dt;P.inv-=dt;P.stats.dist=Math.round(P.d/10);
    for(let i=0;i<T.objs.length;i++){
      const o=T.objs[i];if(P.flags[i])continue;
      const od=o.d+(o.v||0)*time,dd=od-P.d;if(dd>90||dd<-90)continue;
      const dx=Math.abs(T.cx(od)+o.off-P.x);
      if(o.t==='car'){
        if(P.inv<=0&&dx<(c.w+42)/2*.85&&Math.abs(dd)<(c.l+78)/2*.85){
          add(P,-1,'💥 −1');P.stats.crash++;P.v*=.2+.1*c.tgh;P.inv=1.4;P.shake=.4;P.nitro=0;
          tone(200,60,.4,'sawtooth',.13);try{navigator.vibrate&&navigator.vibrate(160)}catch(e){}
        }
      }else if(dx<c.w/2+17&&Math.abs(dd)<c.l/2+17){
        if(o.t==='oil'){if(P.inv>0||P.spin>0)continue;P.flags[i]=1;P.spin=.8;P.v*=.6;P.pops.push({t:0,text:'Šmyk!',color:'#111827'});tone(500,150,.4,'sine',.1);continue;}
        P.flags[i]=1;
        if(o.t==='star'){add(P,1);P.stats.star++;tone(900,1400,.07,'square',.05);}
        else if(o.t==='gold'){add(P,3,null,'#ca8a04');P.stats.gold++;tone(800,1600,.12,'triangle',.12);tone(1200,2000,.15,'triangle',.1,.1);}
        else if(o.t==='nitro'){P.nitro=2.6;P.pops.push({t:0,text:'⚡ Nitro!',color:'#0369a1'});tone(300,1200,.35,'sawtooth',.08);}
      }
    }
    const g=Math.floor(P.d/GATE);
    if(g>P.gate){P.gate=g;add(P,2,'🚩 Brána +2','#7c3aed');tone(523,523,.1,'triangle',.1);tone(784,784,.15,'triangle',.1,.1);}
  }
  function step(dt){
    if(phase==='count'){
      countT-=dt;const c=Math.ceil(countT-.6);
      if(c!==lastCount&&c>=0){lastCount=c;tone(c>0?600:900,c>0?600:900,c>0?.12:.25,'sine',.1);}
      if(countT<=0)phase='play';
    }else if(phase==='play'){
      time+=dt;Ps.forEach(P=>stepP(P,dt));
      if(time>=DUR){phase='end';endT=2;tone(523,523,.15,'triangle',.12);tone(392,392,.3,'triangle',.12,.15);}
    }else{endT-=dt;Ps.forEach(P=>{P.v*=.96;P.d+=P.v*dt;});}
  }

  const hsh=(i,s)=>{const v=Math.sin(i*127.1+s*311.7+hs)*43758.5453;return v-Math.floor(v);};
  function view(P){
    const sx=x=>VW/2+(x-200)*k,sy=d=>carY-(d-P.d)*k;
    const dTop=P.d+carY/k,dBot=P.d-(VH-carY)/k;
    ctx.save();ctx.beginPath();ctx.rect(0,0,VW,VH);ctx.clip();
    ctx.save();
    if(P.shake>0)ctx.translate((Math.random()-.5)*24*P.shake,(Math.random()-.5)*24*P.shake);
    // krajina
    for(let b=Math.floor(dBot/GATE);b<=Math.floor(dTop/GATE);b++){
      const y0=sy(Math.min(dTop+30,(b+1)*GATE)),y1=sy(Math.max(dBot-30,b*GATE));
      ctx.fillStyle=BIO[((b%4)+4)%4].g;ctx.fillRect(-20,y0-1,VW+40,y1-y0+2);
    }
    for(let i=Math.floor(dBot/85)-1;i<=Math.ceil(dTop/85)+1;i++){
      const d=i*85,B=BIO[((Math.floor(d/GATE)%4)+4)%4],c0=T.cx(d),y=sy(d);
      for(const side of[-1,1]){
        const h=hsh(i,side),r=(13+hsh(i,side*3)*11)*k,x=sx(c0+side*(RW+34+h*190));
        ctx.fillStyle='rgba(0,0,0,.13)';ctx.beginPath();ctx.arc(x+4*k,y+5*k,r,0,7);ctx.fill();
        ctx.fillStyle=B.a;ctx.beginPath();ctx.arc(x,y,r,0,7);ctx.fill();
        ctx.fillStyle=B.b;ctx.beginPath();ctx.arc(x-r*.2,y-r*.2,r*.55,0,7);ctx.fill();
      }
    }
    // cesta
    const d0=Math.floor(dBot/24)*24-24,d1=dTop+30;
    ctx.beginPath();
    for(let d=d0;d<=d1;d+=24)ctx.lineTo(sx(T.cx(d)-RW),sy(d));
    for(let d=d1;d>=d0;d-=24)ctx.lineTo(sx(T.cx(d)+RW),sy(d));
    ctx.closePath();ctx.fillStyle='#4b5563';ctx.fill();
    const line=(off,w,col,dash)=>{ctx.beginPath();for(let d=d0;d<=d1;d+=24)ctx.lineTo(sx(T.cx(d)+off),sy(d));
      ctx.lineWidth=w;ctx.strokeStyle=col;ctx.setLineDash(dash||[]);if(dash)ctx.lineDashOffset=(d0*k)%(dash[0]+dash[1]);ctx.stroke();};
    for(const a of[-1,1]){line(a*RW,7*k,'#fff');line(a*RW,7*k,'#ef4444',[16*k,16*k]);line(a*39,3*k,'rgba(255,255,255,.8)',[24*k,30*k]);}
    ctx.setLineDash([]);
    // brány
    for(let g=Math.max(1,Math.floor(dBot/GATE));g<=Math.floor(dTop/GATE);g++){
      const gd=g*GATE,y=sy(gd),xa=sx(T.cx(gd)-RW-12),xb=sx(T.cx(gd)+RW+12),q=(xb-xa)/16;
      for(let i=0;i<16;i++)for(let j=0;j<2;j++){ctx.fillStyle=(i+j)%2?'#111827':'#fff';ctx.fillRect(xa+i*q,y-q+j*q,q+.5,q+.5);}
      ctx.fillStyle='#7c3aed';ctx.fillRect(xa-5*k,y-q-4*k,6*k,2*q+8*k);ctx.fillRect(xb-1*k,y-q-4*k,6*k,2*q+8*k);
    }
    // predmety a premávka
    for(let i=0;i<T.objs.length;i++){
      const o=T.objs[i];if(P.flags[i])continue;
      const od=o.d+(o.v||0)*time;if(od<dBot-60||od>dTop+60)continue;
      const x=sx(T.cx(od)+o.off),y=sy(od);
      if(o.t==='star')drawStar(x,y,(13+Math.sin(clock*6+i)*1.5)*k,'#fde047');
      else if(o.t==='gold'){ctx.shadowColor='#fde047';ctx.shadowBlur=14;drawStar(x,y,(21+Math.sin(clock*6)*2)*k,'#f59e0b');ctx.shadowBlur=0;
        ctx.fillStyle='#fff';ctx.font=FONT(15*k);ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText('3',x,y+1*k);}
      else if(o.t==='nitro'){ctx.fillStyle='#38bdf8';ctx.beginPath();ctx.arc(x,y,16*k,0,7);ctx.fill();ctx.strokeStyle='#fff';ctx.lineWidth=2.5*k;ctx.stroke();
        ctx.fillStyle='#fff';ctx.beginPath();ctx.moveTo(x+2*k,y-11*k);ctx.lineTo(x-7*k,y+2*k);ctx.lineTo(x-1*k,y+2*k);ctx.lineTo(x-3*k,y+11*k);ctx.lineTo(x+7*k,y-3*k);ctx.lineTo(x+1*k,y-3*k);ctx.closePath();ctx.fill();}
      else if(o.t==='oil'){ctx.fillStyle='#111827';ctx.beginPath();ctx.ellipse(x,y,22*k,14*k,0,0,7);ctx.ellipse(x+14*k,y+8*k,10*k,7*k,0,0,7);ctx.fill();
        ctx.fillStyle='rgba(167,139,250,.5)';ctx.beginPath();ctx.ellipse(x-6*k,y-4*k,8*k,3*k,-.4,0,7);ctx.fill();}
      else drawCarTop(TC[o.ci],x,y,k,0);
    }
    // súper na tej istej trati
    for(const Q of Ps){if(Q===P)continue;const y=sy(Q.d);if(y<-60||y>VH+60)continue;
      drawCarTop(Q.car,sx(Q.x),y,k,Q.ang,.6);
      ctx.font=FONT(14*k+6);ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(Q.p.avatar,sx(Q.x),y-Q.car.l*k*.5-10);}
    // moje auto
    const mx=sx(P.x);
    if(!P.on&&phase==='play'){ctx.fillStyle='rgba(120,90,50,.45)';for(let i=0;i<4;i++){ctx.beginPath();ctx.arc(mx+(Math.random()-.5)*30*k,carY+(30+Math.random()*30)*k,(4+Math.random()*6)*k,0,7);ctx.fill();}}
    if(P.nitro>0){for(const a of[-1,1]){const fl=(26+Math.random()*22)*k;ctx.fillStyle='#f97316';ctx.beginPath();ctx.moveTo(mx+a*9*k-5*k,carY+P.car.l*k*.48);ctx.lineTo(mx+a*9*k,carY+P.car.l*k*.48+fl);ctx.lineTo(mx+a*9*k+5*k,carY+P.car.l*k*.48);ctx.fill();
      ctx.fillStyle='#fde047';ctx.beginPath();ctx.moveTo(mx+a*9*k-2.5*k,carY+P.car.l*k*.48);ctx.lineTo(mx+a*9*k,carY+P.car.l*k*.48+fl*.55);ctx.lineTo(mx+a*9*k+2.5*k,carY+P.car.l*k*.48);ctx.fill();}}
    drawCarTop(P.car,mx,carY,k,P.ang,P.inv>0&&Math.floor(clock*12)%2?.35:null);
    ctx.textAlign='center';ctx.textBaseline='middle';ctx.lineJoin='round';
    P.pops.forEach(o=>{ctx.globalAlpha=Math.max(0,1-o.t/.9);ctx.font=FONT(split?20:28);ctx.lineWidth=5;ctx.strokeStyle='#fff';
      txt(o.text,Math.max(70,Math.min(VW-70,mx)),carY-(P.car.l*.5+18)*k-50*o.t,o.color);ctx.globalAlpha=1;});
    ctx.restore();
    // HUD
    const rem=Math.max(0,DUR-time);
    ctx.textBaseline='middle';ctx.lineJoin='round';ctx.strokeStyle='#fff';
    if(split){
      ctx.font=FONT(16);ctx.textAlign='left';
      const lab=P.p.avatar+' '+P.p.name,w=ctx.measureText(lab).width+20;
      ctx.fillStyle=P.p.color;rr(6,6,w,30,10);ctx.fill();ctx.fillStyle='#fff';ctx.fillText(lab,16,22);
      ctx.font=FONT(28);ctx.lineWidth=5;txt(P.score,w+16,23,P.score<0?'#dc2626':'#1f2937');
      ctx.font=FONT(16);ctx.lineWidth=4;ctx.textAlign='right';txt('⏱ '+Math.ceil(rem),VW-8,22,'#1f2937');
      const Q=Ps[1-P.i],df=Math.round((P.d-Q.d)/10);
      ctx.font=FONT(14);txt(df>0?`vedieš o ${df} m`:df<0?`strácaš ${-df} m`:'vyrovnané',VW-8,VH-14,df>=0?'#15803d':'#b91c1c');
    }else{
      ctx.font=FONT(20);ctx.textAlign='left';
      const lab=P.p.avatar+' '+P.p.name,w=ctx.measureText(lab).width+28;
      ctx.fillStyle=P.p.color;rr(10,10,w,44,14);ctx.fill();ctx.fillStyle='#fff';ctx.fillText(lab,24,33);
      ctx.textAlign='center';ctx.font=FONT(40);ctx.lineWidth=6;txt(P.score,Math.max(VW/2,w+60),34,P.score<0?'#dc2626':'#1f2937');
      ctx.font=FONT(20);ctx.textAlign='right';txt('⏱ '+Math.ceil(rem),VW-64,33,'#1f2937');
      ctx.fillStyle='rgba(0,0,0,.2)';rr(10,62,VW-20,10,5);ctx.fill();
      ctx.fillStyle=rem<6?'#ef4444':'#16a34a';rr(10,62,Math.max(10,(VW-20)*rem/DUR),10,5);ctx.fill();
      if(opts.opp)drawOppHud(P.score,opts.opp());
    }
    ctx.font=FONT(split?14:17);ctx.lineWidth=4;ctx.strokeStyle='#fff';ctx.textAlign='left';
    txt(Math.round(P.v*.32)+' km/h'+(P.nitro>0?' ⚡':'')+(split?'':'  ·  '+P.stats.dist+' m'),8,VH-14,'#1f2937');
    // prekrytia
    const big=Math.min(VW,VH*1.3)/4.2,ov=(t,sub)=>{ctx.fillStyle='rgba(255,255,255,.55)';ctx.fillRect(0,0,VW,VH);ctx.textAlign='center';
      ctx.font=FONT(big);ctx.lineWidth=9;ctx.strokeStyle='#fff';txt(t,VW/2,VH*.4,'#7c3aed');
      if(sub){ctx.font=FONT(big*.3);ctx.fillStyle='#1f2937';ctx.fillText(sub,VW/2,VH*.4+big*.8);}};
    if(phase==='count'){const c=Math.ceil(countT-.6);ov(c>0?String(c):'Štart!',c>0?'Ťahaj prstom doľava a doprava':'');}
    if(phase==='end')ov('Cieľ!',P.score+' '+bodW(P.score)+' · '+P.stats.dist+' m');
    ctx.restore();
  }
  function draw(){
    ctx.setTransform(dpr,0,0,dpr,0,0);
    if(split){
      ctx.save();ctx.translate(0,H/2);view(Ps[0]);ctx.restore();
      ctx.save();ctx.translate(W,H/2);ctx.rotate(Math.PI);view(Ps[1]);ctx.restore();
      const rem=Math.max(0,DUR-time);
      ctx.fillStyle='#1f2937';ctx.fillRect(0,H/2-4,W,8);
      ctx.fillStyle=rem<6?'#ef4444':'#22c55e';const bw=W*rem/DUR;ctx.fillRect((W-bw)/2,H/2-2.5,bw,5);
    }else view(Ps[0]);
  }
  function tgt(P,e){const lx=(split&&P.i===1)?W-e.clientX:e.clientX;P.target=Math.max(30,Math.min(370,(lx-VW/2)/k+200));}
  function onDown(e){if(paused)return;const P=split?(e.clientY>=H/2?Ps[0]:Ps[1]):Ps[0];P.pid=e.pointerId;tgt(P,e);}
  function onMove(e){const P=Ps.find(q=>q.pid===e.pointerId);if(P)tgt(P,e);}
  function onUp(e){const P=Ps.find(q=>q.pid===e.pointerId);if(P)P.pid=null;}
  cv.addEventListener('pointerdown',onDown);cv.addEventListener('pointermove',onMove);
  cv.addEventListener('pointerup',onUp);cv.addEventListener('pointercancel',onUp);

  function loop(now){
    raf=requestAnimationFrame(loop);
    let dt=(now-last)/1000;last=now;if(paused)dt=0;
    acc+=Math.min(dt,opts.online?3:.05);
    let n=0;while(acc>=STEP&&n<240){step(STEP);acc-=STEP;n++;}
    const f=Math.min(dt,.05);clock+=f;
    Ps.forEach(P=>{P.pops.forEach(o=>o.t+=f);P.pops=P.pops.filter(o=>o.t<.9);P.shake=Math.max(0,P.shake-f);});
    if(phase==='end'&&endT<=0&&!finished){finished=true;cleanup();done(Ps.map(P=>({score:P.score,stats:P.stats})));return;}
    if(!finished)draw();
  }
  function cleanup(){
    cancelAnimationFrame(raf);removeEventListener('resize',resize);
    cv.removeEventListener('pointerdown',onDown);cv.removeEventListener('pointermove',onMove);
    cv.removeEventListener('pointerup',onUp);cv.removeEventListener('pointercancel',onUp);
    document.removeEventListener('visibilitychange',onVis);
    quitBtn.style.left='';quitBtn.style.right='';quitBtn.style.top='';
    cv.style.display='none';quitBtn.style.display='none';app.style.display='';document.body.classList.remove('playing');
  }
  function askQuit(){
    if(opts.online){modal('Opustiť hru? Spojenie so súperom sa ukončí.',[{t:'Hrať ďalej',cls:'primary',fn:()=>{}},{t:'Odísť',cls:'danger',fn:leave}]);return;}
    paused=true;
    modal('Ukončiť hru a vrátiť sa na výber hier?',[
      {t:'Hrať ďalej',cls:'primary',fn:()=>{paused=false;}},
      {t:'Ukončiť',cls:'danger',fn:()=>{finished=true;cleanup();CUR=null;gamesScreen();}}]);
  }
  function onVis(){if(!opts.online&&document.hidden&&phase==='play'&&!paused)askQuit();}
  document.addEventListener('visibilitychange',onVis);
  quitBtn.onclick=askQuit;
  raf=requestAnimationFrame(loop);
  return {abort(){if(!finished){finished=true;cleanup();}closeModal();}};
}

/* ---------- aplikácia (PWA) ---------- */
let installEvt=null;
const isStandalone=()=>matchMedia('(display-mode: fullscreen)').matches||matchMedia('(display-mode: standalone)').matches||navigator.standalone;
if('serviceWorker' in navigator&&location.protocol.startsWith('http')){
  addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
}
addEventListener('beforeinstallprompt',e=>{e.preventDefault();installEvt=e;const b=$('#install');if(b)b.style.display='';});
addEventListener('appinstalled',()=>{installEvt=null;const b=$('#install');if(b)b.style.display='none';});
function installBtnHtml(){return `<button class="secondary" id="install" style="${installEvt&&!isStandalone()?'':'display:none'}">📲 Nainštalovať ako aplikáciu</button>`;}
function bindInstall(){const b=$('#install');if(b)b.onclick=async()=>{if(!installEvt)return;installEvt.prompt();try{await installEvt.userChoice;}catch(e){}installEvt=null;b.style.display='none';};}

home();
</script>
